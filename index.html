<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYA Games</title>
<style>
  :root { --bg: #f7f9f7; --fg: #1d2b22; --muted: #5b6b61; --accent: #27ae60; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101820; --fg: #e6efe9; --muted: #9fb0a6; } }
  body { background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0 16px; }
  main { max-width: 720px; margin: 40px auto 80px; }
  h1 { font-size: 1.8rem; margin-bottom: 0; }
  h2 { font-size: 1.15rem; margin-top: 2rem; color: var(--accent); }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>CYA Games</h1>
<p class="muted">Small games for Android.</p>

<h2>Bamboo Simulator</h2>
<p>Steer a root deep underground, collect water and nutrients, then watch your bamboo shoot up toward the Moon.</p>

<h2>Contact</h2>
<p><a href="mailto:cyagames.studio@gmail.com">cyagames.studio@gmail.com</a></p>
</main>
</body>
</html>
